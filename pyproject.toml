[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-log-diagnostics"
version = "0.1.0"
description = "A safety-first MCP server for retrieving diagnostic log evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.0,<2",
  "paramiko>=3.4,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
argus = "argus.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
